<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secretaria – Acesso</title>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#14161a;--mut:#5d6570;--acc:#1b4f9c;--acc2:#eaf1fb;--red:#d62718;--bd:#dfe3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}
#login{max-width:420px;margin:0 auto;padding:40px 16px}
#login .hd{text-align:center;border-bottom:4px solid var(--red);padding-bottom:14px;margin-bottom:18px}
#login .hd img{width:100%;max-width:340px;height:auto}
#login h1{font-size:1.4rem;color:var(--acc);margin:.4em 0 .2em}
#login p{color:var(--mut);margin:0 0 14px}
#login label{font-size:.85rem;font-weight:bold;color:var(--mut);display:block;margin-top:12px}
#login input{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin-top:4px;background:#fff;color:var(--ink)}
#login button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:10px 18px;border-radius:8px;margin-top:16px;width:100%}
#login button:disabled{opacity:.6;cursor:wait}
#err{color:#c4281c;font-size:.9rem;min-height:1.4em;margin-top:10px}
.ft{font-size:.8rem;color:var(--mut);margin-top:18px;text-align:center}
.hide{display:none}
.lk{text-align:center;font-size:.85rem;margin-top:12px}.lk a{color:var(--acc)}
#rerr{color:#c4281c;font-size:.9rem;min-height:1.4em;margin-top:10px}
#login h2{font-size:1.1rem;color:var(--acc);margin:.2em 0}
</style>

  var h='<label for="iper">Período</label><select id="iper"><option value="mes"'+(per==='mes'?' selected':'')+'>Este mês</option><option value="30"'+(per==='30'?' selected':'')+'>Últimos 30 dias</option><option value="90"'+(per==='90'?' selected':'')+'>Últimos 90 dias</option><option value="ano"'+(per==='ano'?' selected':'')+'>Este ano</option><option value="tudo"'+(per==='tudo'?' selected':'')+'>Todo o período</option></select>';
  h+='<div class="kpi"><div><b>'+L.length+'</b>cartas geradas</div><div><b>'+tp.apresentacao+'</b>apresentação</div><div><b>'+tp.festividade+'</b>festividade</div><div><b>'+ativas+'/'+nm.length+'</b>congregações com cartas</div></div>';
  h+='<div class="ovf"><table class="t2"><thead><tr><th>Congregação</th><th>Total</th><th>Apresent.</th><th>Festiv.</th><th>Última</th></tr></thead><tbody>'+nm.map(function(n){var o=by[n];return '<tr><td>'+esc(n)+'</td><td><b>'+o.t+'</b></td><td>'+o.a+'</td><td>'+o.f+'</td><td>'+fd(o.l)+'</td></tr>'}).join('')+'</tbody></table></div>';
  if(pa)h+='<p class="sub">'+pa+' do total foram geradas pelo próprio administrador.</p>';
  var ms=[],mm={};for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1),k=d.getFullYear()+'-'+(d.getMonth()+1);ms.push([k,('0'+(d.getMonth()+1)).slice(-2)+'/'+String(d.getFullYear()).slice(2)]);mm[k]=0}
  rows.forEach(function(x){var d=new Date(Number(x.ts)),k=d.getFullYear()+'-'+(d.getMonth()+1);if(k in mm)mm[k]++});
  var mx=Math.max.apply(null,ms.map(function(m){return mm[m[0]]}).concat([1]));
  h+='<h2>Cartas por mês</h2><div class="bars">'+ms.map(function(m){return '<div class="bw"><span>'+m[1]+'</span><i style="width:'+Math.round(mm[m[0]]/mx*100*0.8)+'%"></i><b>'+mm[m[0]]+'</b></div>'}).join('')+'</div>';
  h+='<div class="acts" style="margin-top:12px"><button class="alt" type="button" id="irel">Atualizar</button></div>';
  return h}
 function gsText(){return GS.replace('%W%',v('#i_tk',ip)||'SEU-TOKEN-ESCRITA').replace('%R%',v('#i_rt',ip)||'SEU-TOKEN-LEITURA')}
 function cfgForm(){var c=r.pl.cfg;
  return '<details class="cfg"'+(cfgok()?'':' open')+'><summary><b>Configurar conexão</b></summary><p class="sub">Os registros ficam em uma planilha do Google, só sua. Faça uma vez:</p><ol><li>Crie uma planilha no Google Planilhas.</li><li>Clique em Extensões → Apps Script, apague o código que aparece e cole o script abaixo (clique em “Gerar tokens” antes).</li><li>Clique em Implantar → Nova implantação → engrenagem → App da Web. Em “Executar como” escolha Eu e em “Quem pode acessar” escolha Qualquer pessoa. Autorize e copie o endereço que termina em /exec.</li><li>Cole o endereço aqui, clique em Salvar conexão e depois em Publicar alterações (na aba Administração).</li></ol><div class="grid"><div class="full"><label for="i_url">Endereço do Apps Script (termina em /exec)</label><input id="i_url" value="'+esc(c.url)+'"></div><div><label for="i_tk">Token de escrita</label><input id="i_tk" value="'+esc(c.tk)+'"></div><div><label for="i_rt">Token de leitura</label><input id="i_rt" value="'+esc(A.cfg.rtk)+'"></div></div><div class="acts" style="margin-top:10px"><button class="alt" type="button" id="igen">Gerar tokens</button><button class="go" type="button" id="isv">Salvar conexão</button></div><label for="igs">Script para colar no Apps Script</label><textarea class="cd" id="igs" readonly style="min-height:140px">'+esc(gsText())+'</textarea><button class="alt" type="button" id="igc" style="margin-top:8px">Copiar script</button></details>'}
 function indRender(){
  var h='<h2>Indicadores</h2><p class="sub">Cartas geradas nas congregações. Só registramos o tipo de carta, a congregação, o usuário e a data; nenhum nome de membro.</p>';
  if(!cfgok())h+='<div class="pw">Os indicadores ainda não estão ativados. Abra “Configurar conexão” abaixo e siga o passo a passo.</div>';
  else if(loading)h+='<p class="sub">Carregando registros…</p>';
  else if(ierr)h+='<p class="pend">'+esc(ierr)+'</p><button class="alt" type="button" id="irel">Tentar de novo</button>';
  else if(rows)h+=dash();
  var open=ip.querySelector('details.cfg')&&ip.querySelector('details.cfg').open;
  ip.innerHTML=h+cfgForm();if(open)ip.querySelector('details.cfg').open=true;
  function on(id,fn){var e=ip.querySelector('#'+id);if(e)e.onclick=fn}
  var sp=ip.querySelector('#iper');if(sp)sp.onchange=function(){per=this.value;indRender()};
  on('irel',carregar);
  function upGS(){ip.querySelector('#igs').value=gsText()}
  ['i_tk','i_rt'].forEach(function(id){ip.querySelector('#'+id).oninput=upGS});
  on('igen',function(){ip.querySelector('#i_tk').value=gen(24);ip.querySelector('#i_rt').value=gen(24);upGS()});
  on('igc',function(){copiar(ip.querySelector('#igs').value,this)});
  on('isv',function(){var url=v('#i_url',ip),tk=v('#i_tk',ip),rt=v('#i_rt',ip);
   if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(url)){alert('O endereço deve começar com https://script.google.com/macros/s/ e terminar com /exec');return}
   if(url&&(tk.length<12||rt.length<12||tk===rt)){alert('Gere os tokens (dois diferentes, com 12+ caracteres).');return}
   r.pl.cfg=Object.assign({},r.pl.cfg,{url:url,tk:tk});A.cfg={rtk:rt};rows=null;pend=true;
   aesKey(d64(Kb),['encrypt']).then(function(k){return encr(k,r.pl)}).then(function(x){D.p=x;ierr='';alert('Conexão salva. Vá em Administração e clique em Publicar alterações.');indRender()})})}
 if(r.rec){setTab('adm');ed='admin';msg='<p class="pend">Acesso por recuperação. Defina agora uma nova senha do administrador e publique.</p>';render()}
}
