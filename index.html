<title>Secretaria – Acesso</title>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#14161a;--mut:#5d6570;--acc:#1b4f9c;--acc2:#eaf1fb;--red:#d62718;--bd:#dfe3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}
#login{max-width:420px;margin:0 auto;padding:40px 16px}
#login .hd{text-align:center;border-bottom:4px solid var(--red);padding-bottom:14px;margin-bottom:18px}
#login .hd img{width:100%;max-width:340px;height:auto}
#login h1{font-size:1.4rem;color:var(--acc);margin:.4em 0 .2em}
#login p{color:var(--mut);margin:0 0 14px}
#login label{font-size:.85rem;font-weight:bold;color:var(--mut);display:block;margin-top:12px}
#login input{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin-top:4px;background:#fff;color:var(--ink)}
#login button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:10px 18px;border-radius:8px;margin-top:16px;width:100%}
#login button:disabled{opacity:.6;cursor:wait}
#err{color:#c4281c;font-size:.9rem;min-height:1.4em;margin-top:10px}
.ft{font-size:.8rem;color:var(--mut);margin-top:18px;text-align:center}
.hide{display:none}
</style>

async function encr(key,obj){var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(obj)));return {iv:e64(iv),ct:e64(new Uint8Array(ct))}}
async function tagOf(u){return hex(await crypto.subtle.digest('SHA-256',enc.encode('ieadm:'+u))).slice(0,12)}
async function pbk(u,pw,salt){var km=await crypto.subtle.importKey('raw',enc.encode(u+':'+pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function entrar(u,s){
 var t=await tagOf(u);
 for(var i=0;i<D.e.length;i++){var e=D.e[i];if(e.t!==t)continue;
  try{var w=await dec(await pbk(u,s,d64(e.s)),e);
   var pl=await dec(await aesKey(d64(w.k),['decrypt']),D.p),prof=null,adm=null,pr=D.r.find(function(x){return x.t===t});
   if(pr&&w.ku)prof=await dec(await aesKey(d64(w.ku),['decrypt']),pr);
   if(w.ka)adm=await dec(await aesKey(d64(w.ka),['decrypt']),D.a);
   return {w:w,pl:pl,prof:prof,adm:adm,u:u}}catch(x){}}
 return null}
function montar(r){
 var st=document.createElement('style');st.textContent=r.pl.css;document.head.appendChild(st);
 document.getElementById('login').classList.add('hide');
 var a=document.getElementById('app');a.innerHTML=r.pl.html;a.classList.remove('hide');
 var p=r.prof||{};document.getElementById('quem').textContent=p.nome||r.u;
 var sc=document.createElement('script');sc.textContent=r.pl.js;document.body.appendChild(sc);
 var m={igreja:p.nome,cidade:p.cidade,endereco:p.endereco,pastor:p.pastor,tel:p.tel,secretario:p.secretario};
 window.PADRAO=r.w.role!=='admin'?m:{};
 if(r.adm)adminInit(r);
 window.scrollTo(0,0)}
document.getElementById('lf').addEventListener('submit',async function(ev){
 ev.preventDefault();var b=document.getElementById('b'),er=document.getElementById('err');
 var u=document.getElementById('u').value.trim().toLowerCase(),s=document.getElementById('s').value;
 b.disabled=true;er.textContent='';
 if(!window.crypto||!crypto.subtle){er.textContent='Este navegador não suporta o acesso seguro.';b.disabled=false;return}
 var r=await entrar(u,s);
 if(r){document.getElementById('s').value='';montar(r);return}
 falhas++;er.textContent='Usuário ou senha incorretos.';
 setTimeout(function(){b.disabled=false},Math.min(falhas*1500,10000))});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function adminInit(r){
 var ka=r.w.ka,Kb=r.w.k,A=r.adm,pend=false,ed=null,msg='',main=document.querySelector('#app main'),bar=main.querySelector('.ses');
 var F=[['nome','Congregação'],['pastor','Pastor / dirigente responsável'],['tel','Telefone do pastor'],['secretario','Secretário(a)'],['endereco','Endereço completo'],['cidade','Cidade/UF'],['dirigentes','Dirigentes']];
 var st=document.createElement('style');st.textContent='#adm .card{border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:10px 0}#adm .u{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#adm .u button,#adm .acts button{margin:0 8px 0 0;padding:7px 14px}#adm .acts{margin-top:14px}main.modoadm>:not(.ses):not(#adm){display:none}main:not(.modoadm)>#adm{display:none}.pw{background:#fff8d6;border:1px solid #e0c200;border-radius:8px;padding:10px 12px;margin:10px 0}.pw b{font:1.15rem monospace}.pend{color:#b45f06;font-weight:bold}.ses button.on{background:var(--acc);color:#fff}@media print{#adm{display:none!important}}';
 document.head.appendChild(st);
 window.CONGS=function(){return A.users.filter(function(u){return u.role!=='admin'}).map(function(u){return u.prof})};
 var panel=document.createElement('div');panel.id='adm';main.appendChild(panel);
 function tab(l,adm){var b=document.createElement('button');b.type='button';b.className='alt'+((adm?false:true)?' on':'');b.textContent=l;b.onclick=function(){main.classList.toggle('modoadm',adm);b1.classList.toggle('on',!adm);b2.classList.toggle('on',adm);if(adm){ed=null;render()}else if(window.renderCong)renderCong()};return b}
 var b1=tab('Cartas',false),b2=tab('Administração',true);bar.insertBefore(b2,bar.firstChild);bar.insertBefore(b1,b2);
 function gen(){var al='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',v=crypto.getRandomValues(new Uint8Array(12)),s='';v.forEach(function(x,i){s+=al[x%al.length];if(i%4==3&&i<11)s+='-'});return s}
 function ud(n){return A.users.find(function(u){return u.user===n})}
 async function mkWrap(u,pw){var salt=crypto.getRandomValues(new Uint8Array(16)),o={k:Kb,ku:u.ku,role:u.role};if(u.role==='admin')o.ka=ka;var x=await encr(await pbk(u.user,pw,salt),o);return {t:await tagOf(u.user),s:e64(salt),iv:x.iv,ct:x.ct}}
 function setE(arr,n){var i=arr.findIndex(function(x){return x.t===n.t});if(i<0)arr.push(n);else arr[i]=n}
 async function putProf(u){var x=await encr(await aesKey(d64(u.ku),['encrypt']),u.prof);x.t=await tagOf(u.user);setE(D.r,x)}
 function pwBox(u,pw){return '<div class="pw">Senha de <b>'+esc(u)+'</b>: <b>'+esc(pw)+'</b><br><span class="sub" style="margin:0">Anote agora: ela não será mostrada de novo. Depois, clique em Publicar alterações.</span></div>'}
 function render(){
  var h='<h2>Administração</h2><p class="sub">Cadastre e edite as congregações e as secretarias com acesso ao portal.</p>'+msg;
  if(ed===null){
   h+='<button class="go" type="button" id="anew">+ Nova congregação</button>';
   A.users.forEach(function(u){h+='<div class="card u"><div><b>'+esc(u.prof.nome||u.user)+'</b><br><span class="sub" style="margin:0">usuário: '+esc(u.user)+(u.role==='admin'?' · administrador':'')+(u.prof.secretario?' · secretário(a): '+esc(u.prof.secretario):'')+'</span></div><button class="alt" type="button" data-e="'+esc(u.user)+'">Editar</button></div>'});
   h+='<p class="'+(pend?'pend':'sub')+'">'+(pend?'Há alterações ainda não publicadas.':'Nenhuma alteração pendente.')+'</p><button class="go" type="button" id="apub"'+(pend?'':' disabled')+'>Publicar alterações</button>'}
  else{var nv=ed==='__novo',u=nv?{prof:{}}:ud(ed);
   h+='<fieldset><legend>'+(nv?'Nova congregação':'Editar: '+esc(u.prof.nome||u.user))+'</legend><div class="grid"><div class="full"><label for="a_user">Usuário (login)</label><input id="a_user" value="'+esc(u.user||'')+'"'+(nv?'':' disabled')+' autocapitalize="none"></div>';
   F.forEach(function(f){h+='<div'+(['nome','endereco'].indexOf(f[0])>-1?' class="full"':'')+'><label for="a_'+f[0]+'">'+f[1]+'</label><input id="a_'+f[0]+'" value="'+esc(u.prof[f[0]]||'')+'"></div>'});
   h+='</div></fieldset><div class="acts"><button class="go" type="button" id="asv">Salvar</button>'+(nv?'':'<button class="alt" type="button" id="apw">Gerar nova senha</button>')+((nv||u.role==='admin')?'':'<button class="alt" type="button" id="adel">Remover</button>')+'<button class="alt" type="button" id="acn">Cancelar</button></div>'}
  panel.innerHTML=h;
  function on(id,fn){var e=panel.querySelector('#'+id);if(e)e.onclick=fn}
  panel.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){ed=b.getAttribute('data-e');msg='';render()}});
  on('anew',function(){ed='__novo';msg='';render()});on('acn',function(){ed=null;render()});
  on('asv',salvar);on('apw',novaSenha);on('adel',remover);on('apub',publicar)}
 async function salvar(){
  var nv=ed==='__novo',un=nv?panel.querySelector('#a_user').value.trim().toLowerCase():ed,p={};
  F.forEach(function(f){p[f[0]]=panel.querySelector('#a_'+f[0]).value.trim()});
  if(!p.nome){alert('Informe o nome da congregação.');return}
  if(nv&&(!/^[a-z0-9._-]{3,}$/.test(un)||ud(un))){alert('Usuário inválido ou já existente. Use 3+ letras minúsculas, números, ponto, hífen ou sublinhado.');return}
  var u,pw=null;
  if(nv){u={user:un,role:'sec',ku:e64(crypto.getRandomValues(new Uint8Array(32))),prof:p};pw=gen();A.users.push(u);setE(D.e,await mkWrap(u,pw))}else{u=ud(un);u.prof=p}
  await putProf(u);pend=true;ed=null;msg=pw?pwBox(un,pw):'';render()}
 async function novaSenha(){if(!confirm('Gerar uma nova senha? A senha atual deixará de funcionar após publicar.'))return;var u=ud(ed),pw=gen();setE(D.e,await mkWrap(u,pw));pend=true;msg=pwBox(u.user,pw);ed=null;render()}
 async function remover(){if(!confirm('Remover esta congregação? O acesso dela será cancelado ao publicar.'))return;var u=ud(ed),t=await tagOf(u.user);A.users=A.users.filter(function(x){return x!==u});D.e=D.e.filter(function(x){return x.t!==t});D.r=D.r.filter(function(x){return x.t!==t});pend=true;ed=null;msg='';render()}
 async function publicar(){
  var art=window.claude&&claude.use?await claude.use('artifact'):null;
  if(!art){msg='<p class="pend">Não foi possível publicar daqui. Abra o portal logado na sua conta Claude (dona do portal).</p>';render();return}
  try{D.a=await encr(await aesKey(d64(ka),['encrypt']),A);
   var html=A.shell.replace('__DATA__',function(){return JSON.stringify(D)});
   msg='<p class="sub">Publicando… a página vai recarregar e você precisará entrar de novo.</p>';render();
   await art.publish(html)}
  catch(e){msg='<p class="pend">'+(e&&(e.code==='not_writer'||e.code==='not_granted')?'Esta conta não tem permissão para editar o portal. Entre na conta Claude dona do portal.':'Não foi possível publicar ('+esc(e&&e.code||'erro')+'). Tente de novo.')+'</p>';render()}}
 render()}
</script>
